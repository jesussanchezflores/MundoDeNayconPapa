<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#87ceeb" />
    <title>Mundo de Nay y de papá</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      body { font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif; user-select: none; }
      canvas { display: block; cursor: grab; touch-action: none; }
      canvas:active { cursor: grabbing; }
      .hud {
        position: fixed; left: 16px; color: #fff; font-weight: bold;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); pointer-events: none;
      }
      #titulo { top: 12px; font-size: 32px; }
      #avisoSonido { top: 56px; font-size: 18px; }
      #marcador { left: auto; right: 76px; top: 14px; font-size: 28px; white-space: pre; }
      #mensaje {
        display: none; left: 50%; top: 30%; transform: translate(-50%, -50%);
        font-size: 48px; text-align: center; line-height: 1.3;
        background: rgba(0, 0, 0, 0.45); padding: 20px 36px; border-radius: 20px;
      }
      #mensaje small { font-size: 22px; }
      #destello { inset: 0; left: 0; background: #ff3d00; opacity: 0; }
      #ayuda {
        bottom: 12px; font-size: 16px; background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px; border-radius: 10px;
      }

      button { font-family: inherit; cursor: pointer; }

      /* ⚙️ Botón y panel de ajustes */
      #botonAjustes {
        position: fixed; top: 10px; right: 12px; width: 52px; height: 52px; font-size: 30px;
        border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 14px; background: rgba(0, 0, 0, 0.35);
      }
      #panel {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.45); padding: 16px; z-index: 10;
      }
      #panel[hidden] { display: none; }
      #panel .tarjeta {
        background: #fff; color: #222; border-radius: 20px; width: min(460px, 100%);
        max-height: 100%; min-width: 0; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      #panel h2 { margin: 0; padding: 16px 20px 8px; font-size: 24px; }
      #panel .campos { overflow-y: auto; padding: 0 20px; }
      #panel h3 { margin: 16px 0 6px; font-size: 18px; }
      #panel .campo {
        display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 16px;
      }
      #panel .campo span { flex: 1; min-width: 0; }
      #panel .campo input[type="range"] { width: 120px; flex-shrink: 1; min-width: 70px; }
      #panel .campo output { width: 32px; text-align: right; font-weight: bold; }
      #panel .campo input[type="checkbox"] { width: 24px; height: 24px; }
      #panel .campo select { font-size: 16px; padding: 4px; border-radius: 8px; max-width: 120px; }
      #panel .muestra { width: 22px; height: 22px; border-radius: 6px; border: 1px solid #0003; }
      #panel .botones { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px 18px; }
      #panel .botones button {
        flex: 1 1 40%; font-size: 16px; padding: 10px; border: 0; border-radius: 12px; background: #eee;
      }
      #panel .botones button[data-accion="aplicar"] { background: #43a047; color: #fff; font-weight: bold; }

      /* 📱 Controles táctiles: solo aparecen en celular o tableta */
      .tactil { display: none; }
      body.movil .tactil { display: block; }
      body.movil #ayuda { display: none; }
      body.movil #titulo { font-size: 20px; }
      body.movil #marcador { font-size: 20px; top: 72px; right: 12px; }
      body.movil #mensaje { font-size: 28px; }
      body.movil #mensaje small { font-size: 16px; }
      #palanca {
        position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom));
        width: 130px; height: 130px; border-radius: 50%; touch-action: none;
        background: rgba(255, 255, 255, 0.2); border: 3px solid rgba(255, 255, 255, 0.6);
      }
      #bolita {
        position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s; pointer-events: none;
      }
      #palanca.activa #bolita { transition: none; }
      #botonSalto {
        position: fixed; right: calc(28px + env(safe-area-inset-right)); bottom: calc(36px + env(safe-area-inset-bottom));
        width: 96px; height: 96px; border-radius: 50%; font-size: 40px; touch-action: none;
        background: rgba(255, 255, 255, 0.3); border: 3px solid rgba(255, 255, 255, 0.7);
      }
      #botonSalto:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.5); }
      .tactil, #botonAjustes { -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="titulo" class="hud">🧱 Mundo de Nay y de papá</div>
    <div id="ayuda" class="hud">
      ⬆️⬇️⬅️➡️ o WASD: caminar · Espacio: saltar · Shift: correr · Arrastra el mouse o Q/E: girar la cámara · Espacio 2 veces: ¡súper salto! · M: silenciar · R: empezar de nuevo
    </div>
    <div id="avisoSonido" class="hud">🔊 Toca la pantalla o una tecla para activar el sonido</div>
    <div id="marcador" class="hud"></div>
    <div id="mensaje" class="hud"></div>
    <div id="destello" class="hud"></div>

    <button id="botonAjustes" aria-label="Ajustes">⚙️</button>
    <div id="panel" hidden>
      <div class="tarjeta">
        <h2>⚙️ Ajustes del juego</h2>
        <div class="campos"></div>
        <div class="botones">
          <button data-accion="aplicar">✅ Aplicar</button>
          <button data-accion="cerrar">✖️ Cerrar</button>
          <button data-accion="reiniciar">🔄 Empezar de nuevo</button>
          <button data-accion="original">↩️ Valores originales</button>
        </div>
      </div>
    </div>

    <div id="palanca" class="tactil"><div id="bolita"></div></div>
    <button id="botonSalto" class="tactil" aria-label="Saltar">⬆️</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
